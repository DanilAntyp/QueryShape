name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and .NET 10 (every targeted runtime; no roll-forward in CI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QueryShape.slnx

      - name: Build
        run: dotnet build QueryShape.slnx --configuration Release --no-restore

      # Multi-targeted test projects run once per target on the real runtime (both are installed, so nothing rolls forward).
      - name: Test (net8.0 on the .NET 8 runtime)
        shell: bash
        run: |
          for p in tests/QueryShape.Core.Tests tests/QueryShape.Testing.Tests tests/QueryShape.OpenTelemetry.Tests tests/QueryShape.SampleApp.Tests; do
            dotnet test "$p" --configuration Release --no-build --framework net8.0 --filter "Category!=Slow" --logger "trx;LogFileName=$(basename $p).net8.trx" --results-directory TestResults || exit 1
          done

      - name: Test (net10.0 on the .NET 10 runtime)
        shell: bash
        run: |
          for p in tests/QueryShape.Core.Tests tests/QueryShape.Testing.Tests tests/QueryShape.OpenTelemetry.Tests tests/QueryShape.SampleApp.Tests; do
            dotnet test "$p" --configuration Release --no-build --framework net10.0 --filter "Category!=Slow" --logger "trx;LogFileName=$(basename $p).net10.trx" --results-directory TestResults || exit 1
          done

      - name: Test (single-target projects: CLI unit tests, analyzer)
        shell: bash
        run: |
          for p in tests/QueryShape.Cli.Tests tests/QueryShape.Analyzers.Tests; do
            dotnet test "$p" --configuration Release --no-build --filter "Category!=Slow" --logger "trx;LogFileName=$(basename $p).trx" --results-directory TestResults || exit 1
          done

      - name: End-to-end `queryshape verify` (builds a worktree; runs alone so nothing else holds the sample app's binaries)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test tests/QueryShape.Cli.Tests --configuration Release --no-build --framework net10.0 --filter "Category=Slow" --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack QueryShape.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  readme-smoke:
    name: README commands (sample app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run the sample app and hit the demo endpoints
        run: |
          dotnet run --project tests/QueryShape.SampleApp -f net10.0 --urls http://127.0.0.1:5077 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5077/ >/dev/null && break; sleep 1; done
          curl -s -D - -o /dev/null http://127.0.0.1:5077/bad/n-plus-one | grep -i "x-queryshape: 41 queries; QS001 Error"
          curl -s -D - -o /dev/null http://127.0.0.1:5077/good/n-plus-one | grep -i "x-queryshape: 1 quer"

  pr-report:
    name: QueryShape report on the sample app (PR comment)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Report (from source, this repository builds the CLI itself)
        env:
          CI: "true"
        run: |
          set +e
          dotnet run --project src/QueryShape.Cli -f net10.0 -- report --project tests/QueryShape.SampleApp.Tests --markdown > queryshape.md 2> progress.log
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
          cat queryshape.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('queryshape.md', 'utf8') + '\n<!-- queryshape-action -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.data.find(c => c.body && c.body.includes('<!-- queryshape-action -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
