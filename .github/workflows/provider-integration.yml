name: Provider integration

# The provider tests that CI runs on every push cover SQL Server, PostgreSQL and MySQL. Oracle's image is measured in
# gigabytes and takes minutes to become ready, so it runs here, on request, behind QUERYSHAPE_ORACLE.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Every provider on EF Core 10, Oracle included
        env:
          QUERYSHAPE_ORACLE: '1'
        run: dotnet test tests/QueryShape.Core.Tests --configuration Release --framework net10.0 --filter "Category=Integration" --logger "console;verbosity=detailed"

      - name: SQL Server, PostgreSQL and MySQL on EF Core 8
        run: dotnet test tests/QueryShape.Core.Tests --configuration Release --framework net8.0 --filter "Category=Integration" --logger "console;verbosity=detailed"
